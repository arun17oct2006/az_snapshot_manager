name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AzureSnapshotManager.sln

      - name: Build
        run: dotnet build AzureSnapshotManager.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AzureSnapshotManager.sln --no-build --configuration Release --verbosity normal

      - name: Check for outdated/vulnerable packages
        run: dotnet list AzureSnapshotManager.sln package --vulnerable --include-transitive
        continue-on-error: true
